targets:
  $default:
    # A geração de código só interessa em lib/. Sem isso o build_runner varre
    # test/ inteiro a cada execução, o que apenas custa tempo.
    sources:
      - lib/**
      - pubspec.yaml
    builders:
      drift_dev:
        options:
          # Enums persistidos pelo nome: renomear/reordenar valores no Dart não
          # corrompe as linhas já gravadas no dispositivo do usuário.
          store_date_time_values_as_text: true
